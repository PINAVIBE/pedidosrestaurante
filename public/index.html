<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comedor Universitario</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main id="login" hidden>
    <div class="login-box">
      <img class="login-art" src="img/almuerzo-ejecutivo.jpg" alt="">
      <h1>Comedor<br>Universitario</h1>
      <form id="fLogin">
        <label>Correo<input name="email" type="email" autocomplete="username" required></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <button>Ingresar</button>
        <p class="hint" style="font-size:.85rem;opacity:.75;margin:.6rem 0 0">¿Olvidaste tu contraseña? Pide al administrador que la restablezca.</p>
      </form>
      <form id="fReg" hidden>
        <label>Nombre completo<input name="nombre" autocomplete="name" maxlength="80" required></label>
        <label>Correo<input name="email" type="email" autocomplete="username" required></label>
        <label>Contraseña (mínimo 8 caracteres)<input name="password" type="password" minlength="8" maxlength="72"
            autocomplete="new-password" required></label>
        <button>Crear cuenta de estudiante</button>
      </form>
      <p id="loginErr" role="alert"></p>
      <button type="button" class="link" id="alt">¿No tienes cuenta? Regístrate</button>
    </div>
  </main>
  <div id="app" hidden>
    <aside>
      <h2>Comedor U</h2>
      <nav id="nav"></nav>
      <p id="quien"></p>
      <button class="ghost" data-a="salir">Cerrar sesión</button>
    </aside>
    <section id="view"></section>
  </div>
  <dialog id="dlg">
    <form id="frm"></form>
  </dialog>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>

</html>
